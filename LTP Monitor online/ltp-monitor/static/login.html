<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LTP Monitor — sign in</title>
<style>
  :root{
    --bg:#0B0E14; --panel:#151A23; --panel2:#1B212C; --line:#2C3542;
    --text:#E8ECF3; --dim:#97A3B8; --muted:#6C7A91; --accent:#8B5CF6;
    --up:#2FD07A; --dn:#FF5C6C;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--bg);color:var(--text);
       font-family:'Roboto',system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        padding:28px;width:100%;max-width:380px}
  h1{font-size:17px;margin:0 0 4px;font-weight:600}
  .sub{font-size:12.5px;color:var(--dim);margin:0 0 20px}
  label{display:block;font-size:12px;color:var(--dim);margin:14px 0 5px}
  input{width:100%;padding:9px 11px;border-radius:7px;border:1px solid var(--line);
        background:var(--panel2);color:var(--text);font-size:14px;font-family:inherit}
  input:focus{outline:none;border-color:var(--accent)}
  button{width:100%;margin-top:20px;padding:10px;border:0;border-radius:7px;
         background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;
         font-family:inherit}
  button:disabled{opacity:.55;cursor:default}
  .msg{margin-top:14px;font-size:12.5px;padding:9px 11px;border-radius:7px;display:none}
  .msg.err{display:block;background:rgba(255,92,108,.12);color:var(--dn)}
  .msg.ok{display:block;background:rgba(47,208,122,.12);color:var(--up)}
  .secret{margin-top:14px;padding:12px;background:var(--panel2);border:1px solid var(--line);
          border-radius:7px;font-size:12px;color:var(--dim);display:none}
  .secret code{display:block;margin:7px 0;padding:8px;background:var(--bg);border-radius:5px;
               color:var(--text);font-family:'Roboto Mono',ui-monospace,monospace;
               font-size:13px;letter-spacing:.06em;word-break:break-all}
  .hint{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5}
  .code-input{letter-spacing:.32em;text-align:center;font-family:'Roboto Mono',ui-monospace,monospace}
  .qr{display:none;margin:12px auto 6px;background:#fff;padding:10px;border-radius:8px;
      width:max-content;line-height:0}
  .qr svg{display:block;width:190px;height:190px}
</style>
</head>
<body>
<div class="card">
  <h1 id="title">Sign in</h1>
  <p class="sub" id="subtitle">LTP Option Chain Monitor</p>

  <form id="form" autocomplete="off">
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>

    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>

    <div id="codeWrap">
      <label for="c">Authenticator code</label>
      <input id="c" class="code-input" inputmode="numeric" pattern="[0-9]*" maxlength="6"
             autocomplete="one-time-code" placeholder="000000">
    </div>

    <button id="go" type="submit">Sign in</button>
  </form>

  <div class="msg" id="msg"></div>

  <div class="secret" id="secretBox">
    <b>Scan with Google Authenticator</b>
    <div id="qrBox" class="qr"></div>
    <div class="hint" id="qrHint">In the app: <b>+ &rarr; Scan a QR code</b>.
      Can't scan? Use the setup key below.</div>
    <code id="secretVal"></code>
    <div class="hint">Manual entry: <b>+ &rarr; Enter a setup key</b>, account
      <b>LTP Monitor</b>, key above, type <b>Time based</b>. Then enter the
      6-digit code below to finish. This key is shown once.</div>
    <label for="c2">Code from the app</label>
    <input id="c2" class="code-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000">
    <button id="confirm" type="button">Confirm and finish</button>
  </div>
</div>

<script>
(function(){
  var MODE="login", pendingUser=null;
  var $=function(id){return document.getElementById(id);};
  function say(text, ok){
    var m=$("msg"); m.textContent=text; m.className="msg "+(ok?"ok":"err");
    if(!text) m.className="msg";
  }
  async function api(path, body){
    var r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},
                            body:JSON.stringify(body||{})});
    var d={}; try{ d=await r.json(); }catch(e){}
    if(!r.ok) throw new Error(d.detail||d.error||("HTTP "+r.status));
    return d;
  }
  fetch("/api/auth/status").then(function(r){return r.json();}).then(function(s){
    if(s.needs_setup){
      MODE="setup";
      $("title").textContent="Create the admin account";
      $("subtitle").textContent="First run — this account manages users.";
      $("codeWrap").style.display="none";
      $("p").setAttribute("autocomplete","new-password");
      $("go").textContent="Create admin";
    }else if(!s.require_mfa){
      $("codeWrap").style.display="none";
    }
  }).catch(function(){});

  $("form").addEventListener("submit", async function(e){
    e.preventDefault(); say(""); $("go").disabled=true;
    try{
      if(MODE==="setup"){
        var d=await api("/api/auth/setup",{username:$("u").value,password:$("p").value});
        pendingUser=d.username;
        if(d.qr_svg){
          // Server-rendered SVG, not a URL: a GET carrying the TOTP
          // secret would land in access logs and browser history.
          $("qrBox").innerHTML=d.qr_svg;
          $("qrBox").style.display="block";
        }else{
          $("qrHint").textContent="QR unavailable (install segno) — use the setup key below.";
        }
        $("secretVal").textContent=d.secret;
        $("secretBox").style.display="block";
        $("form").style.display="none";
        say("Admin created. Now pair your authenticator.", true);
      }else{
        await api("/api/auth/login",{username:$("u").value,password:$("p").value,
                                     code:$("c").value});
        location.href="/";
      }
    }catch(err){ say(err.message||"sign-in failed", false); }
    $("go").disabled=false;
  });

  $("confirm").addEventListener("click", async function(){
    say(""); $("confirm").disabled=true;
    try{
      await api("/api/auth/mfa/confirm",{username:pendingUser,code:$("c2").value});
      say("Authenticator paired. Enable auth_enabled in Settings, then sign in.", true);
      $("secretVal").textContent="•".repeat(32);
      $("qrBox").innerHTML=""; $("qrBox").style.display="none";
      $("c2").disabled=true;
      setTimeout(function(){ location.href="/login"; }, 4000);
    }catch(err){ say(err.message||"could not verify", false); $("confirm").disabled=false; }
  });
})();
</script>
</body>
</html>
