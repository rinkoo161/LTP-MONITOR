[project]
name = "marketsense"
version = "0.1.0"
description = "NSE market intelligence & equity advisory platform — decision support, not execution"
requires-python = ">=3.11"

dependencies = [
    # --- HTTP ---------------------------------------------------------
    # curl_cffi impersonates Chrome's TLS fingerprint, which is what NSE's
    # Akamai bot protection actually checks. Plain `requests`/`httpx` get
    # blocked even with perfect browser headers — this is a settled finding
    # from the LTP Monitor codebase (nse_client.py), not a guess.
    "curl_cffi>=0.7",
    "httpx>=0.27",          # everything that is NOT nseindia.com
    "feedparser>=6.0",
    "defusedxml>=0.7",      # RSS/XBRL are untrusted input; never bare ElementTree

    # --- storage ------------------------------------------------------
    # Postgres is BOTH the store and the event bus (outbox + LISTEN/NOTIFY).
    # psycopg3 is the one driver that does sync, async, and native
    # notifications, so there is exactly one DB dependency.
    "SQLAlchemy>=2.0",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",

    # --- app ----------------------------------------------------------
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]
# Phase 2 — not installed yet; A2 does not exist.
docintel = ["pdfplumber>=0.11", "pytesseract>=0.3"]

[project.scripts]
ms = "marketsense.cli.main:app"

[tool.setuptools.packages.find]
include = ["marketsense*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:marketsense.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
